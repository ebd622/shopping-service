spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shopping}
    username: ${DB_USERNAME:shopping}
    password: ${DB_PASSWORD:shopping}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

